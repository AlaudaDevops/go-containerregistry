name: Auto Tag for Alauda

on:  # yamllint disable-line rule:truthy
  push:
    branches:
      - "alauda-v*"

permissions:
  contents: write
  packages: write

jobs:
  tag:
    name: auto-tag-alauda
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Derive Alauda tag prefix from branch
        id: derive
        shell: bash
        run: |
          set -euo pipefail
          branch_name="${GITHUB_REF#refs/heads/}"
          if [[ ! "$branch_name" =~ ^alauda-v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Unexpected branch format: $branch_name"
            echo "Expected format: alauda-vX.Y.Z"
            exit 1
          fi

          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          base_version="v${major}.${minor}.${patch}"

          # Bump patch by 1 so the resulting "-alauda-N" pre-release tag
          # sorts *after* the upstream base_version under SemVer (a
          # pre-release of vX.Y.Z is considered less than vX.Y.Z itself).
          # Example: branch alauda-v0.21.0 -> tag prefix v0.21.1-alauda,
          # producing v0.21.1-alauda-N which is > v0.21.0 and < v0.21.1.
          # See yq's alauda-auto-tag.yaml for the same convention.
          next_patch=$((patch + 1))
          next_version="v${major}.${minor}.${next_patch}"
          tag_prefix="${next_version}-alauda"

          echo "base_version=$base_version" >> "$GITHUB_OUTPUT"
          echo "next_version=$next_version" >> "$GITHUB_OUTPUT"
          echo "tag_prefix=$tag_prefix" >> "$GITHUB_OUTPUT"

      - name: Compute next Alauda tag
        id: next
        shell: bash
        run: |
          set -euo pipefail
          tag_prefix="${{ steps.derive.outputs.tag_prefix }}"
          existing_tags=$(git tag --list "${tag_prefix}-*" | sort -V)

          max_index=-1
          for tag in $existing_tags; do
            index="${tag##*-}"
            if [[ "$index" =~ ^[0-9]+$ ]] && (( index > max_index )); then
              max_index="$index"
            fi
          done

          next_index=$((max_index + 1))
          new_tag="${tag_prefix}-${next_index}"
          echo "new_tag=$new_tag" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        run: |
          set -euo pipefail
          new_tag="${{ steps.next.outputs.new_tag }}"
          git tag "$new_tag"
          git push origin "$new_tag"

  release-alauda:
    name: release-alauda
    needs: [tag]
    uses: ./.github/workflows/reusable-release-alauda.yaml
